
VM_RELEASE=11.1

# NetBSD/alpha on QEMU clipper (see the alpha branch in build.py). With no
# SRM console every boot loads the kernel directly: the install kernel
# (ramdisk root) with the CD attached, then GENERIC with root on wd0a.
# anyvm boots the image the same way, from the netbsd-11.1-alpha-kernel
# release asset (files/fetch-alpha-kernel.sh).
VM_ISO_LINK="https://ftp.netbsd.org/pub/NetBSD/NetBSD-11.1/images/NetBSD-11.1-alpha.iso"
VM_INSTALL_KERNEL_LINK="https://ftp.netbsd.org/pub/NetBSD/NetBSD-11.1/alpha/installation/instkernel/netbsd.gz"
VM_KERNEL_LINK="https://ftp.netbsd.org/pub/NetBSD/NetBSD-11.1/alpha/binary/kernel/netbsd-GENERIC.gz"
VM_KERNEL_APPEND="root=/dev/wd0a"
VM_OS_NAME="netbsd"
VM_SSH_PORT=2225

VM_MEMORY=1024
VM_CPU=1
VM_DISK_SIZE=20G

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
VM_SHUTDOWN_MAX_SECONDS=1200

VM_INSTALL_CMD="/usr/sbin/pkg_add"
# No fuse-sshfs package is built for alpha.
VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG=
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG"
VM_OCR="py"
VM_LOGIN_TAG="login:"
VM_OPTS="conf/netbsd-11.1-alpha.opts.txt"
VM_ARCH=alpha
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1
VM_SYNC_METHODS="rsync,scp,nfs,tar"
