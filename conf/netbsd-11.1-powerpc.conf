
VM_RELEASE=11.1

# NetBSD/macppc on QEMU mac99 (see the powerpc branch in build.py). The
# install ISO boots ofwboot.xcf from the CD; after the install,
# hooks/host_afterInstall.sh adds the boot partition OpenBIOS loads the
# kernel from, and VM_KERNEL_LINK is the kernel it puts there (the same
# GENERIC sysinst installs as /netbsd).
VM_ISO_LINK="https://ftp.netbsd.org/pub/NetBSD/NetBSD-11.1/images/NetBSD-11.1-macppc.iso"
VM_KERNEL_LINK="https://ftp.netbsd.org/pub/NetBSD/NetBSD-11.1/macppc/binary/kernel/netbsd-GENERIC.gz"
VM_OS_NAME="netbsd"
VM_SSH_PORT=2225

# Above 256 MB the kernel panics inside OpenBIOS early in boot; mac99 has
# one CPU. NetBSD's gem(4) cannot drive the default sungem NIC.
VM_MEMORY=256
VM_CPU=1
VM_NIC=rtl8139
# The OpenBIOS from QEMU 11.1: the runners' QEMU 10.2 bundles one that
# cannot match the boot disk to the kernel's bootpath, so the installed
# system finds no root. Fetched by hooks/host_beforeBuild.sh.
VM_BIOS="build/openbios-ppc"
VM_DISK_SIZE=20G

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
VM_SHUTDOWN_MAX_SECONDS=1200

VM_INSTALL_CMD="/usr/sbin/pkg_add"
VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fuse-sshfs"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"
VM_OCR="py"
VM_LOGIN_TAG="login:"
VM_OPTS="conf/netbsd-11.1-powerpc.opts.txt"
VM_ARCH=powerpc
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1
VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"
