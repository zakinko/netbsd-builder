
VM_RELEASE=11.1

# The DVD, as on amd64, but for another reason. i386 has no base32, and its
# install ISO gets through set extraction, but sysinst then stops at
# "The set "manhtml" is optional and not included on this distribution
# medium ... [enter to continue]", which the shared answer file has no line
# for. The DVD carries manhtml.
VM_ISO_LINK="https://ftp.netbsd.org/pub/NetBSD/NetBSD-11.1/images/NetBSD-11.1-i386-dvd.iso"
VM_OS_NAME="netbsd"
VM_SSH_PORT=2225




VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
# Build-time installs run BARE pkg_add on purpose: PKG_PATH comes from
# /etc/pkg_install.conf, which hooks/vm_postBuild.sh bakes (this release's
# own quarterly first, rolling alias second, newest quarterly of the major
# branch third) right before this install step runs. Going through
# the same baked file the shipped image uses means a bad bake FAILS THE
# BUILD instead of surfacing weeks later at runtime, which is exactly how
# the dead riscv64 alias slipped through (netbsd-vm run 30790664175).
VM_INSTALL_CMD="/usr/sbin/pkg_add"

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fuse-sshfs"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"
VM_OCR="py"

VM_LOGIN_TAG=") (constty)"

# Under KVM on an x86_64 host, like amd64.
VM_ARCH="i386"

VM_OPTS="conf/netbsd-10.0.opts.txt"



VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"
